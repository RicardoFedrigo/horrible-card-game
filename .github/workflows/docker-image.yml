name: Build and Deploy to GCP

# Assumindo estrutura do repo:
#   /front  -> Dockerfile do frontend (bun run build)
#   /back   -> Dockerfile do backend (bun run start)
# Deploy feito em duas Cloud Run services separadas (front-service / back-service).
# Ajuste os paths e nomes conforme a estrutura real do seu projeto.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY }}

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [front, back]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            -f ./${{ matrix.service }}/Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest \
            --build-arg VITE_API_URL=${{ secrets.BACKEND_URL }} \
            ./${{ matrix.service }}
        # O --build-arg só faz sentido no build do "front" (React precisa
        # saber a URL do back em tempo de build). Se o Dockerfile do "back"
        # não usa esse ARG, o Docker simplesmente ignora — sem problema.
        # Ajuste o nome da variável (VITE_API_URL / REACT_APP_API_URL) para
        # o que seu bundler (Vite/CRA) realmente espera.

      - name: Push image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest

  deploy:
    name: Deploy (${{ matrix.service }})
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [front, back]
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy front to Cloud Run
        if: matrix.service == 'front'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: front-service
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/front:${{ github.sha }}
          flags: --allow-unauthenticated

      - name: Deploy back to Cloud Run
        if: matrix.service == 'back'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: back-service
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/back:${{ github.sha }}
          env_vars: |
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          # session-affinity + timeout maior ajudam a manter conexões
          # WebSocket (socket.io) estáveis no Cloud Run
          flags: --allow-unauthenticated --session-affinity --timeout=3600
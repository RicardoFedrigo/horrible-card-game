name: Build and Deploy to GCP

on:
  push:
    branches: ["master"]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY }}/backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build frontend static assets
        env:
          VITE_SOCKET_URL: ${{ vars.BACKEND_URL }}
        run: |
          bun install --frozen-lockfile --filter @horrible-card-game/web
          bun run --cwd apps/frontend build
          cp apps/frontend/dist/index.html apps/frontend/dist/404.html

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy backend \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --session-affinity \
            --quiet

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Deploy frontend to Cloud Storage
        run: |
          gcloud storage rsync apps/frontend/dist gs://${{ env.GCS_BUCKET }} \
            --recursive \
            --delete-unmatched-destination-objects
          gcloud storage cp apps/frontend/dist/index.html gs://${{ env.GCS_BUCKET }}/index.html \
            --cache-control="no-cache, no-store, max-age=0"
          gcloud storage cp apps/frontend/dist/404.html gs://${{ env.GCS_BUCKET }}/404.html \
            --cache-control="no-cache, no-store, max-age=0"

      - name: Configure website hosting
        run: |
          gcloud storage buckets update gs://${{ env.GCS_BUCKET }} \
            --web-main-page-suffix=index.html \
            --web-error-page=404.html
